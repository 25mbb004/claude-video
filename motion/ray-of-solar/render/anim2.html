<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}#gl{display:none}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<canvas id="gl" width="960" height="540"></canvas>
<script>
// INK RIDGES — long cut. renderAt(T) takes SONG time in seconds (0:15.98 → 1:56.98).
(async () => {
const W = 1920, H = 1080;
const DROP = 63.82, BEAT = 0.443, BAR = BEAT * 4;
const barT = k => DROP + k * BAR;                       // bar k relative to the drop
const START = barT(-27), END = barT(30);               // 15.98 → 116.98
const CH = { groove1: barT(-27), breakdown: barT(-16), ret: barT(-8), build: barT(-4), silence: 62.70, drop: DROP, dip: barT(16), groove2: barT(20), outro: barT(29) };
const ROLL = [56.84,57.05,57.17,57.29,57.39,57.50,57.61,57.73,57.94,58.05,58.18,58.38,58.52,58.61,58.74,58.83,58.95,59.05,59.27,59.39,59.51,
  59.72,59.83,59.95,60.06,60.17,60.28,60.39,60.61,60.73,60.84,60.95,61.06,61.17,61.28,61.39,61.5,61.61,61.72,61.84,61.94,62.06,62.16,62.28,62.4,62.51,62.63];
const BEATS = []; for (let k = START; k < END + 1; k += BEAT) BEATS.push(k);
const L1 = 'I ride out on a ray of solar', L2 = 'I ride a chariot of notions';
const LYRICS = [[14.25, 21.0, L1], [21.25, 28.25, L2], [28.5, 35.0, L1], [99.5, 106.25, L2], [106.5, 113.0, L1], [113.25, 120.5, L2]];

const clamp = (x, a = 0, b = 1) => Math.min(Math.max(x, a), b);
const sm = t => t * t * (3 - 2 * t);
const lerp = (a, b, u) => a + (b - a) * u;
const ramp = (T, a, b) => sm(clamp((T - a) / (b - a)));
const easeOutBack = u => { const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
const easeOut = u => 1 - Math.pow(1 - u, 3);
const pulse = (T, hits, rate, lo, hi) => { let s = 0; for (const h of hits) if (h >= lo && h < hi && T >= h) s += Math.exp(-(T - h) * rate); return Math.min(s, 1.5); };

// ---------- ink shader (Gold Ink, live) ----------
const gl = document.getElementById('gl').getContext('webgl2', { preserveDrawingBuffer: true });
const common = await (await fetch('common.glsl')).text(), body = await (await fetch('ink_anim.frag')).text();
const fsrc = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uShot; uniform float uTime;
out vec4 fragColor;
${common}
${body}
void main(){ fragColor = vec4(render(gl_FragCoord.xy), 1.); }`;
const mk = (ty, src) => { const o = gl.createShader(ty); gl.shaderSource(o, src); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
const pr = gl.createProgram();
gl.attachShader(pr, mk(gl.VERTEX_SHADER, `#version 300 es\nin vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`));
gl.attachShader(pr, mk(gl.FRAGMENT_SHADER, fsrc)); gl.linkProgram(pr); gl.useProgram(pr);
const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const al = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(al); gl.vertexAttribPointer(al, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(pr, n);
gl.uniform2f(U('uRes'), 960, 540); gl.viewport(0, 0, 960, 540);
function ink(shot, time, rot, grow, pls) {
  gl.uniform1f(U('uShot'), shot); gl.uniform1f(U('uTime'), time); gl.uniform1f(U('uRot'), rot);
  gl.uniform1f(U('uGrow'), grow); gl.uniform1f(U('uPulse'), pls);
  gl.drawArrays(gl.TRIANGLES, 0, 3); return gl.canvas;
}
const FILL = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = 'out/ink_fill.jpg'; });
await document.fonts.load("300 36px 'Inter Display'"); await document.fonts.load("200 64px 'Inter Display'");

// ---------- terrain ----------
const perm = new Uint8Array(512); { let s = 1337; const p = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { s = (s * 16807) % 2147483647; const j = s % (i + 1); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; }
const hv = (x, y) => perm[(perm[x & 255] + y) & 511] / 255;
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = sm(x - xi), yf = sm(y - yi);
  const a = hv(xi, yi), b = hv(xi + 1, yi), cc = hv(xi, yi + 1), d = hv(xi + 1, yi + 1);
  return a + (b - a) * xf + (cc - a) * yf + (a - b - cc + d) * xf * yf; }
function fbm(x, y) { let s = 0, a = .5; for (let i = 0; i < 5; i++) { s += a * vnoise(x, y); x *= 2.03; y *= 2.03; a *= .5; } return s; }
function ridged(x, y) { let s = 0, a = .55; for (let i = 0; i < 5; i++) { s += a * Math.pow(1 - Math.abs(2 * vnoise(x, y) - 1), 2); x *= 2.1; y *= 2.1; a *= .5; } return s; }

const c = document.getElementById('c'), g = c.getContext('2d');
const PAT = g.createPattern(FILL, 'repeat');
const zNear = 3.5, zFar = 60, f = 1150, ROWS = 96;

// scroll = integral of speed, so the landscape never jumps
function scrollAt(T) {
  const seg = [[START, 1.1], [CH.breakdown, .35], [CH.ret, 1.1], [CH.drop, 2.4], [barT(4), 3.6], [barT(8), 2.4], [CH.dip, .6], [CH.groove2, 1.2]];
  let s = 0;
  for (let i = 0; i < seg.length; i++) { const a = seg[i][0], b = i + 1 < seg.length ? seg[i + 1][0] : 1e9; if (T <= a) break; s += (Math.min(T, b) - a) * seg[i][1]; }
  return s;
}

// the horizon sun: one continuous curve, so it never pops between chapters
function sunAt(T) {
  if (T >= CH.silence) return 0;
  let a = .3;
  for (const [a0, a1, txt] of LYRICS) if (txt === L1) a += .45 * ramp(T, a0, a0 + 1.5) * (1 - ramp(T, a1 - .8, a1 + .6));
  return a * (1 - ramp(T, CH.build, CH.silence - .15));   // fades out across the whole build
}
window.renderAt = (T) => {
  const kickOn = (T >= CH.groove1 && T < CH.breakdown) || (T >= CH.ret && T < CH.build) || (T >= CH.drop && T < CH.dip) || (T >= CH.groove2);
  const kick = kickOn ? pulse(T, BEATS, 7, T - 3, T + 1) : 0;
  const roll = T >= CH.build && T < CH.silence ? pulse(T, ROLL, 14, T - 2, T + 1) : 0;
  const scroll = scrollAt(T);
  let amp = 1, spire = .5, camH = 1.9, nearDamp = 0, accentEvery = 4, lineBoost = 1 + .5 * kick, lineAlpha = 1;
  let flash = 0, roll2d = 0, sky = { mode: 'sun', a: .5 }, cssBlur = 0, cssSat = 1, fadeIn = 0, fadeOut = 0, threadA = 0;

  if (T < CH.breakdown) {                          // 1 · groove + lyrics
    amp = 1.05; spire = .5; camH = 1.95;
    const ray = LYRICS.find(l => T >= l[0] && T < l[1]);
    sky = { mode: 'sun', a: .35 + (ray && ray[2] === L1 ? .45 * ramp(T, ray[0], ray[0] + 1.5) : 0) };
    fadeIn = 1 - ramp(T, START, START + .8);
  } else if (T < CH.ret) {                         // 2 · breakdown: terrain dissolves into ink
    const u = ramp(T, CH.breakdown, CH.breakdown + BAR);
    amp = lerp(1.05, .2, u); spire = lerp(.5, 0, u); camH = lerp(1.95, 2.6, u); lineAlpha = 1 - .85 * u; accentEvery = 0;
    sky = { mode: 'drift', a: u * (1 - ramp(T, CH.ret - BAR * .5, CH.ret)) };
  } else if (T < CH.build) {                       // 3 · bass returns: terrain rises out of the dark
    const u = easeOut(clamp((T - CH.ret) / (BAR * 1.2)));
    amp = lerp(.2, 1.15, u); spire = lerp(0, .55, u); camH = lerp(2.6, 1.8, u); lineAlpha = lerp(.15, 1, u);
    sky = { mode: 'sun', a: .3 };
  } else if (T < CH.silence) {                     // 4 · build: the roll
    const u = (T - CH.build) / (CH.silence - CH.build);
    amp = 1.15 + .25 * u; spire = .55 + .35 * u; camH = 1.7; lineBoost = 1 + 1.4 * roll;
    sky = { mode: 'plume', grow: lerp(-.55, .62, sm(u)), a: .35 + .5 * u };
  } else if (T < CH.drop) {                        // 5 · silence
    const s = (T - CH.silence) / (CH.drop - CH.silence);
    amp = lerp(1.4, .05, sm(clamp(s * 4))); spire = lerp(.9, 0, sm(clamp(s * 4))); camH = 1.25; accentEvery = 0; lineAlpha = .5;
    sky = { mode: 'none' }; threadA = sm(clamp(s * 2.5));
  } else if (T < CH.dip) {                         // 6 · DROP 1, escalating every 4 bars
    const d = T - DROP, bar = Math.floor(d / BAR), ub = (d % BAR) / BAR, block = Math.floor(bar / 4);
    const erupt = easeOutBack(clamp(d / .42));
    amp = 3.0 * (.82 + .18 * clamp(erupt, 0, 1.2)) * (1 + .1 * kick); spire = 1.4 * erupt; nearDamp = 1; accentEvery = 1;
    const cams = [[2.6, 1.45, 3.7, 2.1], [1.15, 1.3, 1.15, 1.3], [2.6, 3.7, 1.45, 2.1], [4.4, 4.0, 3.5, 3.0]][block];
    camH = cams[bar % 4] + (block === 3 ? -ub * .45 : 0);
    roll2d = (block === 0 && bar === 3) || (block === 2 && bar % 4 === 1) ? -.035 : (block === 1 ? .02 * Math.sin(d * 1.3) : 0);
    flash = Math.exp(-d * 7.5) + (bar % 4 === 0 && bar > 0 ? .35 * Math.exp(-(d - bar * BAR) * 9) : 0);
    if (block === 2) lineBoost *= 1.35;
    const notch = Math.floor(d / BEAT) * .07 + easeOut(clamp((d % BEAT) / .12)) * .07;
    const grow = (.55 + .45 * easeOut(clamp(d / .5))) * (block === 1 ? 1.12 : block === 3 ? 1.25 : 1);
    sky = { mode: 'eclipse', grow, rot: -(d * .1 + notch), pulse: .55 * kick * (block === 3 ? 1.6 : 1), a: 1 };
  } else if (T < CH.groove2) {                     // 7 · filter dip
    const u = ramp(T, CH.dip, CH.dip + BAR);
    amp = lerp(3.0, .55, u); spire = lerp(1.4, .2, u); nearDamp = 1 - u; accentEvery = u > .6 ? 4 : 1; camH = lerp(2.6, 2.2, u);
    cssBlur = 3.5 * Math.sin(Math.PI * clamp((T - CH.dip) / (CH.groove2 - CH.dip))); cssSat = 1 - .55 * Math.sin(Math.PI * clamp((T - CH.dip) / (CH.groove2 - CH.dip)));
    const d = T - DROP;
    sky = { mode: 'eclipse', grow: lerp(1.25, .5, u), rot: -(d * .1 + 29 * .07), pulse: 0, a: lerp(1, .55, u) };
  } else {                                         // 8 · groove 2 + lyrics, then the ending
    amp = 1.05; spire = .45; camH = 2.0;
    const d = T - DROP;
    sky = { mode: 'eclipse', grow: .5, rot: -(d * .1 + 2.03), pulse: .3 * kick, a: .55 };
    if (T >= CH.outro) {                           // last bar: collapse into the thread, fade out
      const u = ramp(T, CH.outro, CH.outro + BAR * .6);
      amp = lerp(1.05, .05, u); spire = lerp(.45, 0, u); accentEvery = u > .5 ? 0 : 4; lineAlpha = 1 - .5 * u;
      sky.a = .55 * (1 - u); threadA = u;
      fadeOut = ramp(T, END - .75, END);
    }
  }

  const proj = (x, y, z) => [W / 2 + x / z * f, H * .5 - (y - camH) / z * f + 40];
  function height(x, z) {
    const env = Math.exp(-x * x / (2 * (3.2 + z * .12) ** 2));
    const zs = z + scroll;
    let h = (fbm(x * .45 + 10, zs * .45) * .6 + ridged(x * .32 + 3, zs * .32) * .7) * env;
    h += spire * 1.6 * Math.exp(-(x * x) / 2.2 - ((z - 26) ** 2) / 30) * (.7 + .5 * ridged(x * .6, z * .6));
    const nd = lerp(1, .25 + .75 * sm(clamp((z - 4) / 18)), nearDamp);
    return h * amp * nd;
  }

  // ---------- draw ----------
  c.style.filter = cssBlur > .05 || cssSat < .99 ? `blur(${cssBlur.toFixed(2)}px) saturate(${cssSat.toFixed(3)})` : 'none';
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; g.filter = 'none';
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  if (roll2d) { g.translate(W / 2, H / 2); g.rotate(roll2d); g.scale(1.06, 1.06); g.translate(-W / 2, -H / 2); }
  const hy = proj(0, 0, 1e6)[1];
  const skyG = g.createLinearGradient(0, hy - 420, 0, hy + 10);
  skyG.addColorStop(0, 'rgba(0,0,0,0)'); skyG.addColorStop(1, `rgba(255,140,50,${sky.mode === 'eclipse' ? (.2 + .08 * kick) * sky.a : .08})`);
  g.fillStyle = skyG; g.fillRect(-100, -100, W + 200, hy + 110);

  const inkDraw = (src, x, y, w, h, a, filt) => {
    g.globalCompositeOperation = 'screen'; g.filter = filt || 'contrast(1.9) brightness(1.05) saturate(.72)'; g.globalAlpha = clamp(a);
    g.drawImage(src, x, y, w, h); g.globalCompositeOperation = 'source-over'; g.filter = 'none'; g.globalAlpha = 1;
  };
  if (sky.mode === 'eclipse' && sky.a > .01) inkDraw(ink(2, T, sky.rot, sky.grow, sky.pulse), 0, (hy - 230) - 540, 1920, 1080, sky.a);
  if (sky.mode === 'plume') inkDraw(ink(0, T, 0, sky.grow, 0), 330, -170, 1920, 1080, sky.a);
  const sunA = sunAt(T);
  if (sunA > .005) {
    const ga = sunA;
    const glow = g.createRadialGradient(W / 2, hy - 10, 8, W / 2, hy - 10, 160 + 140 * ga);
    glow.addColorStop(0, `rgba(255,195,120,${.55 * ga})`); glow.addColorStop(1, 'rgba(255,120,40,0)');
    g.fillStyle = glow; g.fillRect(0, 0, W, H);
    g.fillStyle = `rgba(255,225,170,${.9 * ga})`; g.beginPath(); g.arc(W / 2, hy - 10, 10 + 10 * ga, 0, Math.PI * 2); g.fill();
  }

  // terrain
  PAT.setTransform(new DOMMatrix());
  for (let r = ROWS - 1; r >= 0; r--) {
    const tt = r / (ROWS - 1), z = zNear + (zFar - zNear) * Math.pow(tt, 1.6);
    const pts = [];
    for (let i = 0; i <= 400; i++) { const x = (i / 400 - .5) * z * 2.1; pts.push(proj(x, height(x, z), z)); }
    g.beginPath(); g.moveTo(pts[0][0], H + 60); for (const p of pts) g.lineTo(p[0], p[1]);
    g.lineTo(pts[pts.length - 1][0], H + 60); g.closePath(); g.fillStyle = '#000'; g.fill();
    g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
    const depth = 1 - tt, haze = .12 + .88 * sm(clamp(depth * 1.7));
    const rowPhase = Math.floor(r + scroll * 1.6);
    const accent = accentEvery === 1 || (accentEvery > 1 && ((rowPhase % accentEvery) + accentEvery) % accentEvery === 0);
    const lw = .8 + 1.6 * depth * (accent ? 1.3 : 1);
    if (accent) {
      const a = (nearDamp > .5 ? .3 + .7 * depth : .25 + .7 * depth) * Math.min(1.7, lineBoost) * lineAlpha;
      g.strokeStyle = `rgba(255,170,90,${clamp(a * .35 * haze)})`; g.lineWidth = lw;
      g.shadowColor = `rgba(255,150,60,${.85 * haze})`; g.shadowBlur = (14 * depth + 4) * haze * (1 + kick * .6); g.stroke(); g.shadowBlur = 0;
      if (depth > .22) {
        PAT.setTransform(new DOMMatrix().translate((r * 389 + T * 60) % 1920, (r * 151 - T * 25) % 1080));
        g.globalAlpha = clamp(a * 1.25 * haze); g.strokeStyle = PAT; g.lineWidth = lw * (lineBoost > 1.3 ? 2.6 : 1.9); g.stroke(); g.globalAlpha = 1;
      }
    } else {
      const a = (.25 + .7 * depth) * .6 * haze * lineAlpha;
      g.strokeStyle = `rgba(220,225,230,${a})`; g.lineWidth = lw; g.stroke();
    }
  }
  // breakdown: gold ink drifting through the frame
  if (sky.mode === 'drift' && sky.a > .01) {
    const z = 1.25 + .05 * Math.sin(T * .25);
    inkDraw(ink(0, T * .55, 0, .62, 0), (W - W * z) / 2 + 150, (H - H * z) / 2 - 40, W * z, H * z, sky.a, 'contrast(1.7) brightness(1.9) saturate(.75)');
  }
  if (threadA > .01) inkDraw(ink(1, T, 0, 1, 0), -60, hy - 14 - 540 * .3, 2040, 1080 * .3, threadA, 'contrast(1.9) brightness(1.1) saturate(.72)');
  g.setTransform(1, 0, 0, 1, 0, 0);

  // lyrics: thin, wide, typed onto the beat
  const ly = LYRICS.find(l => T >= l[0] - .05 && T < l[1]);
  if (ly && T >= START) {
    const [a0, a1, txt] = ly;
    const inA = clamp((T - a0) / .35), outA = 1 - clamp((T - (a1 - .3)) / .3);
    const shade = g.createLinearGradient(0, 760, 0, 1080);
    shade.addColorStop(0, 'rgba(0,0,0,0)'); shade.addColorStop(.35, `rgba(0,0,0,${.55 * Math.min(inA, outA)})`); shade.addColorStop(1, `rgba(0,0,0,${.9 * Math.min(inA, outA)})`);
    g.fillStyle = shade; g.fillRect(0, 760, W, 320);
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.font = "300 36px 'Inter Display', 'Inter', sans-serif"; g.letterSpacing = `${(.62 + (T - a0) * .012).toFixed(3)}em`;
    const chars = txt.toUpperCase().split('');
    const full = g.measureText(txt.toUpperCase()).width;
    let x = W / 2 - full / 2;
    g.textAlign = 'left';
    chars.forEach((ch, i) => {
      const ci = clamp((T - a0 - i * .018) / .25) * outA;
      g.fillStyle = `rgba(246,228,190,${ci})`; g.shadowColor = 'rgba(255,170,80,.7)'; g.shadowBlur = 16;
      g.fillText(ch, x, 902 + (1 - ci) * 8); x += g.measureText(ch).width;
    });
    const fl = clamp((T - (a0 + BAR * 2)) / .3) * outA;   // "I'M FLEEING" lands two bars in
    if (fl > 0) {
      g.font = "200 64px 'Inter Display', 'Inter', sans-serif"; g.letterSpacing = `${(1.05 + (T - a0 - BAR * 2) * .02).toFixed(3)}em`; g.textAlign = 'center';
      g.fillStyle = `rgba(255,208,140,${fl})`; g.shadowBlur = 24; g.fillText("I'M FLEEING", W / 2 + 30, 988);
    }
    g.shadowBlur = 0; g.letterSpacing = '0px';
  }

  if (flash > .01) { g.fillStyle = `rgba(255,232,190,${clamp(flash) * .9})`; g.fillRect(0, 0, W, H); }
  const vg = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.75)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  const blk = Math.max(fadeIn, fadeOut);
  if (blk > 0) { g.fillStyle = `rgba(0,0,0,${blk})`; g.fillRect(0, 0, W, H); }
  const id = g.getImageData(0, 0, W, H), dd = id.data; let s = (Math.floor(T * 24) * 7919 + 13) | 0;
  for (let i = 0; i < dd.length; i += 4) { s = (s * 1103515245 + 12345) & 0x7fffffff; const n = ((s >> 8) / 8388608 - 1) * 8; dd[i] += n; dd[i + 1] += n; dd[i + 2] += n; }
  g.putImageData(id, 0, 0);
  return true;
};
window.START = START; window.END = END;
window.ready = true;
})().catch(e => { window.err = String(e); window.ready = true; });
</script></body></html>
