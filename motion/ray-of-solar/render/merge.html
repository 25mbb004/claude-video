<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
(async () => {
const load = u => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = u; });
const [FILL, S0, S1, S2] = await Promise.all(['out/ink_fill.jpg', 'out/ink_0.png', 'out/ink_1.png', 'out/ink_2.png'].map(load));
// DARK RIDGE LINES — a terrain drawn as occluding glowing lines (shot 0 build · 1 silence · 2 DROP)
const shot = +new URLSearchParams(location.search).get('shot');
const W = 1920, H = 1080, c = document.getElementById('c'), g = c.getContext('2d');

// value noise + fbm
const perm = new Uint8Array(512); { let s = 1337; const p = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { s = (s * 16807) % 2147483647; const j = s % (i + 1); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; }
const hv = (x, y) => perm[(perm[x & 255] + y) & 511] / 255;
const sm = t => t * t * (3 - 2 * t);
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = sm(x - xi), yf = sm(y - yi);
  const a = hv(xi, yi), b = hv(xi + 1, yi), cc = hv(xi, yi + 1), d = hv(xi + 1, yi + 1);
  return a + (b - a) * xf + (cc - a) * yf + (a - b - cc + d) * xf * yf; }
function fbm(x, y, o = 5) { let s = 0, a = .5; for (let i = 0; i < o; i++) { s += a * vnoise(x, y); x *= 2.03; y *= 2.03; a *= .5; } return s; }
function ridged(x, y) { let s = 0, a = .55; for (let i = 0; i < 5; i++) { s += a * Math.pow(1 - Math.abs(2 * vnoise(x, y) - 1), 2); x *= 2.1; y *= 2.1; a *= .5; } return s; }

const P = [
  { amp: 1.35, camH: 1.7, rows: 90, sun: .25, gold: .6, peak: .9 },   // build
  { amp: .05,  camH: 1.25, rows: 82, sun: .35, gold: 0,   peak: 0 },    // silence
  { amp: 3.0,  camH: 2.6, rows: 96, sun: 1,   gold: 1,   peak: 1.4 },    // DROP
][shot];

function height(x, z) {
  const env = Math.exp(-x * x / (2 * (3.2 + z * .12) ** 2));             // valley walls toward the centre
  let h = (fbm(x * .45 + 10, z * .45, 5) * .6 + ridged(x * .32 + 3, z * .32) * .7) * env;
  if (P.peak) h += P.peak * 1.6 * Math.exp(-(x * x) / 2.2 - ((z - 26) ** 2) / 30) * (.7 + .5 * ridged(x * .6, z * .6));
  const nearDamp = shot === 2 ? .25 + .75 * sm(Math.min(Math.max((z - 4) / 18, 0), 1)) : 1;
  return h * P.amp * nearDamp;
}
const zNear = 3.5, zFar = 60, f = 1150;
const proj = (x, y, z) => [W / 2 + x / z * f, H * .5 - (y - P.camH) / z * f + 40];

g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
// horizon sky glow + sun
const hy = proj(0, 0, 1e6)[1];
const sky = g.createLinearGradient(0, hy - 420, 0, hy + 10);
sky.addColorStop(0, 'rgba(0,0,0,0)'); sky.addColorStop(1, `rgba(255,140,50,${.05 + .22 * P.sun})`);
g.fillStyle = sky; g.fillRect(0, 0, W, hy + 10);
// the ink lives in the sky
g.globalCompositeOperation = 'screen'; g.filter = 'contrast(1.9) brightness(1.05) saturate(.72)';
if (shot === 2) g.drawImage(S2, 0, (hy - 230) - 540, 1920, 1080);
if (shot === 0) { g.globalAlpha = .8; g.drawImage(S0, 330, -170, 1920, 1080); g.globalAlpha = 1; }
g.globalCompositeOperation = 'source-over'; g.filter = 'none';
if (shot === 1) { // tiny sun on the horizon
  const glow = g.createRadialGradient(W / 2, hy - 8, 6, W / 2, hy - 8, 120);
  glow.addColorStop(0, 'rgba(255,190,110,.5)'); glow.addColorStop(1, 'rgba(255,120,40,0)');
  g.fillStyle = glow; g.fillRect(0, 0, W, H); }
const PAT = g.createPattern(FILL, 'repeat');

// terrain lines, far → near, each one occludes everything behind it
for (let r = P.rows - 1; r >= 0; r--) {
  const t = r / (P.rows - 1);
  const z = zNear + (zFar - zNear) * Math.pow(t, 1.6);
  const pts = [];
  for (let i = 0; i <= 480; i++) {
    const x = (i / 480 - .5) * z * 2.1;
    pts.push(proj(x, height(x, z), z));
  }
  g.beginPath(); g.moveTo(pts[0][0], H + 5);
  for (const p of pts) g.lineTo(p[0], p[1]);
  g.lineTo(pts[pts.length - 1][0], H + 5); g.closePath();
  g.fillStyle = '#000'; g.fill();

  const depth = 1 - t;                                // 1 = near
  const accent = shot === 0 ? (r % 4 === 0) : shot === 1 ? false : true;
  let col, a, lw, blur;
  if (shot === 1) { col = accent ? [255, 214, 150] : [200, 210, 220]; a = accent ? 1 : .08 + .12 * depth; lw = accent ? 2.2 : 1; blur = accent ? 22 : 0; }
  else {
    const mix = accent ? P.gold : 0;
    col = [Math.round(220 + 35 * mix), Math.round(225 - 70 * mix), Math.round(230 - 150 * mix)];
    a = (shot === 2 ? .3 + .7 * depth : .25 + .7 * depth) * (accent ? 1 : .6);
    lw = .8 + 1.6 * depth * (accent ? 1.3 : 1); blur = accent ? 14 * depth + 4 : 0;
  }
  g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
  if (accent) {           // gold ink running along the line
    const haze = .12 + .88 * sm(Math.min(1, depth * 1.7));   // distant lines sink into the dark
    g.strokeStyle = `rgba(${col},${a * .35 * haze})`; g.lineWidth = lw; g.shadowColor = `rgba(255,150,60,${.85 * haze})`; g.shadowBlur = blur * haze; g.stroke(); g.shadowBlur = 0;
    if (depth > .22) {    // each line samples its own patch of ink, so no vertical streaks stack up
      PAT.setTransform(new DOMMatrix().translate((r * 389) % 1920, (r * 151) % 1080));
      g.globalAlpha = Math.min(1, a * 1.25) * haze; g.strokeStyle = PAT; g.lineWidth = lw * 1.9; g.stroke(); g.globalAlpha = 1;
    }
  } else { g.strokeStyle = `rgba(${col},${a})`; g.lineWidth = lw; g.stroke(); }
}
if (shot === 1) { // the whole landscape collapses into one ink thread on the horizon
  g.globalCompositeOperation = 'screen'; g.filter = 'contrast(1.9) brightness(1.1) saturate(.72)';
  g.drawImage(S1, -60, hy - 14 - 540 * .3, 2040, 1080 * .3); g.filter = 'none'; g.globalCompositeOperation = 'source-over'; }

// film finish: vignette + grain
const vg = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.75)');
g.fillStyle = vg; g.fillRect(0, 0, W, H);
const id = g.getImageData(0, 0, W, H), d = id.data; let s = 99;
for (let i = 0; i < d.length; i += 4) { s = (s * 1103515245 + 12345) & 0x7fffffff; const n = ((s >> 8) / 8388608 - 1) * 9;
  d[i] = Math.max(0, Math.min(255, d[i] + n)); d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n)); d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n)); }
g.putImageData(id, 0, 0);
window.done = true;
})();
</script></body></html>
